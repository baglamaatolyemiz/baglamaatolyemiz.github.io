<!doctype html>
<html lang="tr" class="ld">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<script>/* V57 - landscape phone lays out 1920 wide like the PC, portrait stays 1440 */(function(){var m=document.querySelector('meta[name=viewport]'),q=matchMedia('(orientation:landscape)');function f(){m.setAttribute('content','width='+(q.matches?1920:1440))}f();q.addEventListener?q.addEventListener('change',f):q.addListener(f)})();</script>
<title>Bağlama Atölyesi</title>
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d81e1e; --blue:#1239c8; --green:#1f8a3b;
    --ink:#0b1440; --muted:#6b7280; --soft:#8f96a7; --line:#e3e6ec; --fill:#f7f8f9; --tint:#eef2fd; --bg:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0} html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:14.5pt;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  button{font:inherit;color:inherit}
  .wrap{max-width:1680px;margin:0 auto;padding:0 24px}

  /* top bar */
  .top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .top .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;height:76px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
  .brand img{width:56px;height:56px;display:block}
  .brand b{font-family:"Montserrat",Arial,sans-serif;font-weight:900;font-size:19pt;letter-spacing:.5px;line-height:1;white-space:nowrap}
  .brand b .r{color:var(--red)} .brand b .bl{color:var(--blue)}
  .tabs{display:flex;justify-content:center;gap:8px;height:100%}
  .tabs button{border:0;background:none;padding:0 16px;font-size:12pt;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
  .top .grp{width:56px;height:56px;display:block}

  /* main */
  main{display:grid;grid-template-columns:400px minmax(0,1fr);gap:24px;padding:24px 0;align-items:start}
  .screen{aspect-ratio:16/9;border-radius:3px;overflow:hidden;background:linear-gradient(135deg,#eef2fd 0%,#f7f8fa 55%,#fdf0f0 100%);border:1px solid var(--line)}
  .screen iframe{width:100%;height:100%;border:0;display:block;background:#000}
  .screen video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
  .screen .plyr{height:100%;--plyr-color-main:var(--blue)}
  .screen .plyr video{object-fit:contain}
  .speed{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding-top:8px}
  .speed[hidden]{display:none}
  .speed span{font-size:10.5pt;font-weight:600;color:var(--muted)}
  .speed button{border:1px solid var(--line);background:#fff;border-radius:3px;padding:4px 12px;font-size:11pt;font-weight:600;cursor:pointer}
  .speed button:hover{border-color:var(--blue);color:var(--blue)}
  .speed button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .ctl{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}   /* V28 - Başa+Oynat capsule left, Hız capsule right */
  .idle{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  .idle img{width:150px;height:150px}
  .go{max-width:100%;display:inline-flex;align-items:center;gap:12px;border:0;border-radius:3px;background:var(--red);color:#fff;font-weight:600;font-size:13pt;padding:12px 24px;cursor:pointer}
  .go:hover{background:#b91818}
  .go{font-weight:400;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:linear-gradient(120deg,#0245fb,#1747fc);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px rgba(2,69,251,.32);-webkit-font-smoothing:antialiased}
  .go:hover{background:linear-gradient(120deg,#0139d6,#0f3be6)}
  .idle small{font-size:10.5pt;color:var(--muted)}
  /* V15 - start caption: hairline-framed, tracked small caps, not a button */
  .idle small{display:inline-flex;align-items:center;gap:14px;font-size:8.5pt;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:#6b7280;-webkit-font-smoothing:antialiased}
  .idle small::before,.idle small::after{content:"";width:56px;height:1px}
  .idle small::before{background:linear-gradient(90deg,rgba(160,186,250,0),#a0bafa)}
  .idle small::after{background:linear-gradient(90deg,#a0bafa,rgba(160,186,250,0))}

  .info{display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
  .info .txt{flex:1;min-width:0}
  .chips{display:flex;gap:8px;margin-bottom:8px}
  .chip{font-size:10.5pt;font-weight:600;padding:2px 8px;border-radius:2px;border:1px solid}
  .chip.g{color:var(--blue);border-color:#b9c6f3;background:var(--tint)}
  .chip.l{color:var(--red);border-color:#f2c0c0;background:#fdf1f1}
  .info h2{margin:0;font-size:18pt;font-weight:600;line-height:1.3}
  .info .sub{font-size:10.5pt;color:var(--muted);margin-top:4px}
  .nav{display:flex;gap:8px;flex:none}
  .nav button{border:1px solid var(--line);background:#fff;border-radius:3px;padding:8px 16px;font-size:11pt;font-weight:600;cursor:pointer}
  .nav button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  .nav button:disabled{opacity:.4;cursor:default}

  /* notes */
  .notes{margin-top:24px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .notes .nh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--fill)}
  .notes .nh b{font-size:18pt}
  .notes .nh span{font-size:10.5pt;color:var(--muted)}
  .sheet{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:24px}
  .sheet img{width:100%;height:auto;display:block}
  .sheet:has(img.nota){display:flex;align-items:stretch;gap:16px;overflow:hidden}
  .grp-view{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
  .sheet .grp-view img.nota{width:auto;max-width:100%;max-height:100%;margin:0 auto;object-fit:contain}
  .grp-nav{flex:none;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding:3px;align-self:center;max-height:100%;overflow-y:auto;scrollbar-width:none;background:rgba(255,255,255,.6);border:1px solid #d3dbe8;border-radius:10px}
  .grp-nav button{width:32px;height:26px;font:400 10pt Inter,sans-serif;color:#6b7280;background:none;border:1px solid transparent;border-radius:8px;cursor:pointer}
  .grp-nav button:hover{color:#0141ee}
  .grp-nav button.on{background:#fff;border-color:#a0bafa;color:#0141ee;box-shadow:0 2px 6px rgba(2,69,251,.14)}
  .sheet img.nota[hidden]{display:none}
  .grp-nav button:focus:not(:focus-visible){outline:none}   /* V25 - one note group at a time, letters switch */
  .sheet .ph{text-align:center;color:var(--muted);font-size:13pt;border:1px dashed var(--line);border-radius:3px;width:100%;align-self:stretch;display:flex;align-items:flex-start;justify-content:center;padding-top:96px}

  /* lesson list */
  .cur{border:1px solid var(--line);border-radius:3px;position:sticky;top:100px;max-height:calc(100vh - 124px);display:flex;flex-direction:column;background:#fff}
  .cur .head{padding:16px;border-bottom:1px solid var(--line)}
  .cur .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
  .cur .t b{font-size:18pt}
  .cur .t span{font-size:10.5pt;color:var(--muted)}
  .search{width:100%;font:inherit;font-size:12pt;border:1px solid var(--line);border-radius:3px;padding:8px 12px;background:var(--fill);outline:none}
  .search:focus{border-color:var(--blue);background:#fff}
  .mods{overflow:auto}
  .mod{border-bottom:1px solid var(--line)}
  .mod:last-child{border-bottom:0}
  .mod > button{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:0;background:#fff;padding:12px 16px;cursor:pointer;text-align:left}
  .mod > button:hover{background:var(--fill)}
  .mod .k{font-weight:600;font-size:14.5pt}
  .mod .ch{font-size:9pt;color:var(--muted);transition:transform .15s}
  .mod.open .ch{transform:rotate(180deg)}
  .mod .p{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:10.5pt;color:var(--muted)}
  .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green)}
  .mod ol{list-style:none;margin:0;padding:0 0 8px;display:none}
  .mod.open ol{display:block}
  .row{width:100%;display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;border:0;background:none;padding:8px 16px;text-align:left;font-size:12.5pt;border-left:4px solid transparent}
  button.row{cursor:pointer}
  button.row:hover{background:var(--fill)}
  button.row.on{background:var(--tint);border-left-color:var(--red);font-weight:600}
  .row .n{font-size:10.5pt;color:var(--muted);text-align:right}
  .row .s{font-size:10.5pt;color:var(--blue)}
  .row.off{color:var(--muted)}
  .ek{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font-size:9.5pt;color:var(--muted)}
  .ek::after{content:'';flex:1;border-top:1.5px solid #c9cfda}
  .row.x{cursor:default}
  .row.off .s{color:#a3a9ae}
  .empty{padding:16px;color:var(--muted);font-size:12pt}

  /* footer */
  footer{border-top:1px solid var(--line);margin-top:8px}
  footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px}
  .q{display:inline-flex;align-items:center;gap:12px;border:0;background:none;font-size:13pt;font-weight:600;color:var(--blue);cursor:pointer;text-align:left;padding:0}
  .q i{font-style:normal;font-size:9pt;width:28px;height:28px;flex:none;border-radius:50%;border:1px solid #b9c6f3;display:inline-flex;align-items:center;justify-content:center}
  .q:hover{text-decoration:underline}
  .credit{font-size:10.5pt;color:var(--muted);white-space:nowrap}
  .q{font-weight:400;color:var(--ink)}
  .q:hover{text-decoration:none}
  .q i{border:0;border-radius:9px;color:#fff;font-size:9pt;background:linear-gradient(135deg,#f05252,#c81e1e);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 8px rgba(200,30,30,.35)}
  .row.off .s svg{width:15px;height:15px;fill:none;stroke:#a3a9b8;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
  .q:hover i{background:linear-gradient(135deg,#e53e3e,#a91616)}
  .q .qt{font-style:italic;font-size:12pt;color:#2a3352}
  .qk{display:inline-flex;gap:6px;margin-left:4px}
  .qk em{font-style:normal;font-size:9.5pt;font-weight:600;color:#0141ee;border:1px solid #a0bafa;background:#eff5fe;border-radius:6px;padding:0 8px;line-height:20px}
  /* V93 - footer books as PDF buttons, same look as the song's PDF button (.pdfb) */
  .qk em.pdfk{display:inline-flex;align-items:center;gap:6px;color:#b31616;border-color:#f3c4c4;background:#fff;border-radius:8px;padding:2px 10px 2px 6px;line-height:18px;box-shadow:0 2px 6px rgba(226,59,59,.12)}
  .qk em.pdfk svg{width:14px;height:17px;flex:none}
  .qk em.pdfk:hover{background:#fff4f4;border-color:#e23b3b}
  footer .fe{display:flex;gap:6px;align-items:center} footer .credit .lb{color:#1f2a44} footer .credit a{color:#0141ee;text-decoration:underline;text-underline-offset:2px} footer .credit a:hover{color:#0b1440} /* V95 - mail link classic blue */
  /* V93 - credit in the same pill as the book buttons, no icon */
  footer .credit{font-size:9.5pt;color:#b31616;border:1px solid #f3c4c4;background:#fff;border-radius:8px;padding:2px 10px;line-height:18px;box-shadow:0 2px 6px rgba(226,59,59,.12)}

  /* book switch (desktop only) */
  .seg{display:none}
  .lg{display:none}

  /* one screen (desktop): list, video and notes all in view; page does not scroll */
  @media (min-width:981px){
    body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    .wrap{max-width:none}
    .top .wrap{height:56px}
    .brand img,.top .grp{width:42px;height:42px}
    body > .wrap{flex:1;min-height:0;width:100%}
    main{height:100%;grid-template-columns:420px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px;padding:16px 0}

    /* left card: now playing, search, book switch, list - no inner lines */
    /* row 1: Uzun/Kısa Sap + search | row 2: now playing + prev/next | row 3: books | row 4: list */
    .cur{position:static;height:100%;max-height:none;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto auto minmax(0,1fr);column-gap:8px}
    .cur .side,.side .info,.cur .head{display:contents}
    .cur .head .t{display:none}
    .seg{display:flex;background:var(--fill);border-radius:3px;padding:3px}
    .top .tabs,.top .grp,.brand img{display:none}
    .top .wrap{display:grid;grid-template-columns:420px minmax(0,1fr);gap:16px;height:64px}
    .brand{grid-column:2;justify-self:center}
    .brand b{font-size:25pt;letter-spacing:1px}
    .brand b .r{text-shadow:0 1px 0 #b51818,0 2px 0 #9c1414,0 3px 0 #831010,0 6px 10px rgba(11,20,64,.16)}
    .brand b .bl{text-shadow:0 1px 0 #0f30a8,0 2px 0 #0c2890,0 3px 0 #0a2078,0 6px 10px rgba(11,20,64,.16)}
    .stage{position:relative}
    .lg{display:block;position:absolute;top:0;width:var(--lw,150px);height:var(--lw,150px);transform:translateX(-50%)}
    .lg.l{left:var(--gl,0)} .lg.r{left:var(--gr,100%)}
    /* V18 - the song's lyrics under the right logo, list font */
    .lyr{position:absolute;left:var(--gr,100%);top:calc(var(--lw,150px) + 14px);bottom:12px;width:calc(var(--gw,260px) - 28px);transform:translateX(-50%);overflow:hidden;text-align:left;font-size:10.5pt;font-weight:400;line-height:1.65;color:#1f2740;letter-spacing:.1px;-webkit-font-smoothing:antialiased}
    .lyr[hidden]{display:none}
    .lyr p{margin:0 0 .9em;break-inside:avoid}
    .lyr.two{columns:2;column-gap:14px;text-align:left}
    .lyr span{display:block;padding:0 6px;border-radius:6px;transition:color .25s,background .25s}
    /* V18b - one column, whole lines, tighter leading so a full song fits at a readable size */
    .lyr{line-height:1.38;white-space:nowrap} .lyr p{margin-bottom:.55em} .lyr.two{white-space:normal}
    /* V18d - right column: one rounded frame, top to bottom, holding the group logo and the lyrics */
    .lbox{position:absolute;top:12px;bottom:12px;left:var(--gr,100%);width:calc(var(--gw,260px) - 24px);transform:translateX(-50%);border:1px solid #e3e7ef;border-radius:10px;background:linear-gradient(135deg,#eef2fd 0%,#f7f8fa 55%,#fdf0f0 100%)}
    .lg.r{top:24px;width:min(var(--lw,150px),calc(var(--gw,260px) - 48px));height:min(var(--lw,150px),calc(var(--gw,260px) - 48px))}
    .lyr{top:calc(36px + min(var(--lw,150px),calc(var(--gw,260px) - 48px)));bottom:24px;width:calc(var(--gw,260px) - 48px)}
    .stage.narrow .lbox,.stage.narrow .lyr{display:none}
    /* V43 - the lyric block sits centred under the logo, its lines left-aligned inside it */
    .lyr{width:fit-content;max-width:calc(var(--gw,260px) - 48px)} .lyr.two{width:calc(var(--gw,260px) - 48px)}
    /* V62 - the lyric block centred in the frame by its widest stanza, lines left-aligned; a lone closing line centred */
    .lyr{width:calc(var(--gw,260px) - 48px)} .lyr p.cr{text-align:center}
    /* V23 - left logo framed like the right one */
    .lbox.l{left:var(--gl,0)}
    /* V26 - perde haritasi: the sap in the left frame, the perdes of the shown group lit */
    .sap{position:absolute;left:var(--gl,0);top:12px;bottom:12px;width:calc(var(--gw,260px) - 24px);transform:translateX(-50%);overflow:hidden;border-radius:10px;pointer-events:none}
    .sap[hidden],.stage.narrow .sap{display:none}
    .sap svg{display:block;width:100%;height:100%}
    .lg.l{top:24px;width:min(var(--lw,150px),calc(var(--gw,260px) - 48px));height:min(var(--lw,150px),calc(var(--gw,260px) - 48px))}
    .lyr.sync span{color:#9aa1b2}
    .lyr.sync span.on{color:#0141ee;background:#eff5fe}
    /* V81 - SAZMETRI V0073: a "Bağlantı..." line is blue #1A54C8, regular weight, as on the page */
    .lyr span.bag{color:#1A54C8;font-weight:400}
    .side .gs{grid-row:1;grid-column:1;width:176px;margin:12px 0 0 16px}
    .cur .head .search{grid-row:1;grid-column:2/4;width:auto;margin:12px 16px 0 0}
    .search{font-size:11pt;padding:7px 12px}
    .side .txt{grid-row:2;grid-column:1/3;align-self:center;margin:8px 0 0 16px;line-height:1.35}
    .side .txt h2{font-size:12pt;line-height:1.3}
    .side .txt h2.pick{display:none}
    .side .txt .sub{margin:0}
    .side .nav{grid-row:2;grid-column:3;align-self:center;margin:8px 16px 0 0}
    .side .nav button{padding:3px 12px;font-size:10.5pt;font-weight:400;white-space:nowrap}
    .side .txt .gn{display:none}
    #seg{grid-row:3;grid-column:1/-1;margin:4px 16px 4px}
    .mods{grid-row:4;grid-column:1/-1}
    .seg button{flex:1;display:flex;align-items:baseline;justify-content:center;gap:8px;border:1px solid transparent;background:none;border-radius:2px;padding:4px 0;font-size:11pt;color:var(--muted);cursor:pointer}
    .seg button em{font-style:normal;font-size:9.5pt;color:var(--soft)}
    .seg button:hover{color:var(--ink)}
    .seg button.on{background:#fff;border-color:var(--line);color:var(--blue);font-weight:600}
    .seg button.on em{font-weight:400}
    .mods{flex:1;min-height:0;padding:0 8px 4px}
    .mod{border:0}
    .mod > button{display:none}
    .mods.q .mod > button{display:block;padding:8px 8px 2px;background:none;cursor:default}
    .mods.q .mod .k{font-size:10.5pt;color:var(--muted)}
    .mods.q .mod .ch,.mods.q .mod .p{display:none}
    .mod ol{padding:0}
    .row{min-height:20px;line-height:20px;padding:0 8px;font-size:11.5pt;grid-template-columns:22px 1fr auto;gap:8px;border-left:0;border-radius:3px}
    .row .n{font-size:10.5pt;color:var(--soft);font-variant-numeric:tabular-nums}
    .row{font-weight:400;color:var(--ink)}
    .row .s{font-size:8pt;color:#7d95e0}
    .row.off,.row.off .s{color:var(--soft)}  .row.off .s{font-size:9.5pt}
    button.row.on{background:var(--tint);color:var(--blue);font-weight:600}
    button.row.on .n{color:var(--blue)}

    /* right: video on top (no side bars), speed under it, notes fill the rest */
    main > section{height:100%;min-height:0;display:flex;flex-direction:column;gap:16px}
    .stage{flex:0 0 60%;min-height:0;display:flex;flex-direction:column;align-items:center}
    .stage .screen{flex:1;min-height:0;aspect-ratio:16/9;max-width:100%;background:#000}
    .stage .screen:has(.idle){background:linear-gradient(135deg,#eef2fd 0%,#f7f8fa 55%,#fdf0f0 100%)}
    .stage .speed{align-self:flex-end;padding-top:8px;gap:4px}
    .speed span{font-weight:400}
    .speed button{padding:2px 8px;font-size:10pt;font-weight:400}
    .idle img{width:110px;height:110px}
    .notes{margin-top:0;flex:1;min-height:0;display:flex;flex-direction:column}
    .notes .nh{padding:12px 16px 0;border:0;background:none}
    .notes .nh b{font-size:13.5pt}
    .sheet{flex:1;min-height:0;overflow:auto;padding:8px 16px 16px}
    .sheet .ph{padding-top:0;align-items:center;border:0;color:var(--soft);font-size:11.5pt}
    footer{margin-top:0}
    /* Meet Pilot look: soft page, rounded white cards, tinted card heads, lined list box */
    body{background:#f4f7fc}
    .top{background:#fff;border-bottom-color:#e8ebf1}
    footer{background:#fff;border-top-color:#e8ebf1}

<script>

  const b = document.createElement('button');

(() => { const g = document.createElement('div'); g.className = 'speed vc'; g.id = 'vc'; g.hidden = true;

}

}

function ready(){

  return out;
}

    (f ? '<button class="go" id="go">▶ Başla: ' + esc(split(f.t)[1]) + '</button><small>' + D.groups[g].name + ' · ' + book(D.groups[g].levels[f.li].name) + '</small>'

}
function notes(name, msg, key){
  $('nt').textContent = name;
  const S = N[key] || N[name];   // V46 - key = "<book> <title>" when the same title is in two books
  // V32 - the song title becomes a button that opens the book's full page (with Yazdır) when the page exists
  if (S && S.page) { $('nt').innerHTML = '<button type="button" class="pdfb"><svg viewBox="0 0 24 28" aria-hidden="true"><path d="M3 1h12l6 6v19a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" fill="#fff" stroke="#e23b3b" stroke-width="1.6"/><path d="M15 1v6h6" fill="#fde2e2" stroke="#e23b3b" stroke-width="1.6" stroke-linejoin="round"/><rect x="0" y="13" width="19" height="9" rx="2" fill="#e23b3b"/><text x="9.5" y="20.2" font-size="6.6" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">PDF</text></svg>' + esc(name) + '</button>';
    $('nt').firstChild.onclick = () => window.openPage && openPage(S.page, name, S.pageBW, S.page2, S.pageBW2); }
  if (!S) { $('sheet').innerHTML = '<div class="ph">' + msg + '</div>'; sap(); return; }

  $('sheet').innerHTML = '<div class="grp-view">' + S.groups.map(k => '<img class="nota" data-k="' + k + '" src="' + S.dir + k + '.png?v=117" alt="' + esc(name) + ' ' + k + '" hidden>').join('') + '</div>' +
    '<div class="grp-nav">' + S.groups.map(k => '<button data-k="' + k + '">' + k + '</button>').join('') + '</div>';
  const go = k => { $('sheet').querySelectorAll('[data-k]').forEach(e => e.tagName === 'IMG' ? e.hidden = e.dataset.k !== k : e.classList.toggle('on', e.dataset.k === k)); sap(S, k);
    // V40 - many groups: the list starts at the top (A) and slides down with the active letter
    const nv = $('sheet').querySelector('.grp-nav'), ob = nv && nv.querySelector('button.on');
    if (ob) { const y = ob.offsetTop - nv.offsetTop; if (y < nv.scrollTop || y + ob.offsetHeight > nv.scrollTop + nv.clientHeight) nv.scrollTop = y - (nv.clientHeight - ob.offsetHeight) / 2; } };
  $('sheet').querySelector('.grp-nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.k); };

  const v = $('screen').querySelector('video'), by = o => Array.isArray(o) ? o : (o || {})[cur && cur.id] || [];

      cue.forEach(c => { if (t >= c[0]) k = c[1]; });
      pts.forEach(c => { if (t >= c[0] - .05 && t < c[0] + 1.2) p = c[1]; });

}
// V26 - perde haritasi. Perde positions: ACORDER perde table (Uzun Sap, # branch), n = semitones from the open string.
const PERDE_N = [0, .5, 1, 2, 3, 4, 4.5, 5, 5.5, 6, 7, 8, 9, 9.5, 10, 10.5, 11, 12, 12.5, 13, 14, 15, 16, 16.98];
function sap(S, k, now){
  const el = $('sap'), P = S && S.perde && S.perde[k];
  if (!P) { el.hidden = true; el.innerHTML = ''; sapLast = null; return; }
  el.hidden = false; sapLast = [S, k, now];
  // V26g - his reference drawing (temp/saz-ref.png), line for line: teardrop tekne bottom-left, thin neck to the top-right corner, burgu with pegs;
  // 3 courses (üst 3 tel, orta 2, alt 2), no numbers; dots = the perdes of the group, the one pressed now is the big one
  const kisa = /K[ıi]sa/.test(D.groups[g].name), last = kisa ? 17 : 23;
  const W = el.clientWidth || 300, H = el.clientHeight || 440, lg = document.querySelector('.lg.l'), er = el.getBoundingClientRect();
  const top = lg ? lg.getBoundingClientRect().bottom - er.top + 4 : H * .38;
  let ax = 0, ay = 0, hx = W - 12, hy = top, tot = 0, bw = 0;
  for (let i = 0; i < 3; i++) { bw = tot * .11; ax = 8 + bw * .8; ay = H - 8 - bw * .8; tot = Math.hypot(hx - ax, ay - hy); }   // keep the tekne inside the frame
  const ang = Math.atan2(ay - hy, hx - ax) * 180 / Math.PI;
  const bl = tot * .39, nw = Math.max(5, tot * .015), x0 = tot * .3, xn = tot * .83, cy = [-nw * .6, 0, nw * .6];   // tekne length, half neck width, neck start, nut
  const fx = n => 1 - Math.pow(2, -n / 12), L = (xn - bl - 4) / fx(PERDE_N[last]) / 1.01, x = n => xn - L * fx(n);
  const used = {}; P.split(' ').forEach(p => used[p] = (used[p] || 0) + 1);
  const ln = '#3a3f45', st = ' fill="none" stroke="' + ln + '"';
  let o = '<path d="M' + bl + ' ' + (-nw * .2) + ' C' + bl * .8 + ' ' + (-bw * .4) + ' ' + bl * .64 + ' ' + (-bw) + ' ' + bl * .4 + ' ' + (-bw) +
    ' C' + bl * .14 + ' ' + (-bw) + ' 0 ' + (-bw * .62) + ' 0 0 C0 ' + bw * .62 + ' ' + bl * .14 + ' ' + bw + ' ' + bl * .4 + ' ' + bw +
    ' C' + bl * .64 + ' ' + bw + ' ' + bl * .8 + ' ' + bw * .4 + ' ' + bl + ' ' + nw * .2 + ' Z" fill="#fff"' + st + ' stroke-width="1.1"/>';
  const eb = tot * .11;   // eşik (bridge)

  o += '<rect x="' + x0 + '" y="' + (-nw) + '" width="' + (xn - x0) + '" height="' + nw * 2 + '" fill="#fff"' + st + ' stroke-width="1.1"/>';
  for (let p = 1; p <= last; p++) { const xx = x(PERDE_N[p]);   // perde bağı: a thin double band
    o += '<rect x="' + (xx - .8) + '" y="' + (-nw) + '" width="1.6" height="' + nw * 2 + '" fill="#fff"' + st + ' stroke-width="' + (Number.isInteger(PERDE_N[p]) ? .9 : .6) + '"/>'; }
  // burgu: narrow box, rounded curl at the tip, 4 pegs on the top side, 3 small ones on the other side
  const hd = tot - xn;
  o += '<path d="M' + xn + ' ' + (-nw * .95) + ' L' + (tot - hd * .12) + ' ' + (-nw * .95) + ' Q' + tot + ' ' + (-nw * 1.3) + ' ' + tot + ' ' + (-nw * .2) +
    ' Q' + tot + ' ' + nw * .9 + ' ' + (tot - hd * .14) + ' ' + nw * .9 + ' L' + xn + ' ' + nw * .9 + ' Z" fill="#fff"' + st + ' stroke-width="1.1"/>';
  o += '<line x1="' + xn + '" x2="' + xn + '" y1="' + (-nw) + '" y2="' + nw + '" stroke="' + ln + '" stroke-width="2"/>';
  [.22, .44, .66, .86].forEach(f => { const px = xn + hd * f; o += '<line x1="' + px + '" x2="' + (px - 2) + '" y1="' + (-nw) + '" y2="' + (-nw - 6) + '" stroke="' + ln + '" stroke-width="1"/><circle cx="' + (px - 2.5) + '" cy="' + (-nw - 9.5) + '" r="3.6" fill="#fff"' + st + ' stroke-width="1"/>'; });
  [.34, .56, .78].forEach(f => o += '<circle cx="' + (xn + hd * f) + '" cy="' + (nw + 2.6) + '" r="2" fill="#fff"' + st + ' stroke-width=".9"/>');
  [[-1.2, 0, 1.2], [-.7, .7], [-.7, .7]].forEach((g2, i) => g2.forEach(d => { const y = cy[i] * .8 + d * .8;
    o += '<line x1="' + tot * .015 + '" x2="' + (xn + hd * .9) + '" y1="' + y + '" y2="' + y + '" stroke="' + ln + '" stroke-width=".45"/>'; }));
  Object.keys(used).forEach(p => { p = +p;
    const xx = p ? (x(PERDE_N[p - 1]) + x(PERDE_N[p]) * 2) / 3 : xn + 4, y = cy[2], on = now === p, dim = now != null && !on;
    o += '<circle cx="' + xx + '" cy="' + y + '" r="' + (on ? 5.5 : 3.6) + '" fill="' + (dim ? '#a0bafa' : '#0141ee') + '" stroke="#fff" stroke-width="' + (on ? 1.6 : 1) + '"/>'; });
  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Perde haritası ' + k + '"><g transform="translate(' + ax + ' ' + ay + ') rotate(' + (-ang) + ')">' + o + '</g></svg>';
}
let sapLast = null;
addEventListener('resize', () => sapLast && !$('sap').hidden && sap(...sapLast));
function play(x){
  cur = { g, li: x.li, ii: x.ii, id: x.id };

  const [n, t] = split(x.t);
  $('meta').innerHTML = '<h2>' + esc(t) + '</h2><div class="sub"><span class="gn">' + D.groups[g].name + ' · </span>' + book(D.groups[g].levels[x.li].name) + (n ? ' · Parça ' + n : '') + '</div>';
  notes(t, 'Bu parçanın notası yakında', D.groups[g].levels[x.li].name + ' ' + t);
  lyrics(t);
  if (desk()) open.clear();
  open.add(x.li);
  renderList(); navState();
}
// V18 - lyrics.js: { "<song title>": "lines, a blank line between stanzas" }
function lyrics(t){
  const L = (window.LYRICS || {})[t], el = $('lyr');
  el.hidden = !L; el.classList.remove('sync');
  // optional LRC time tag per line: "[1:23] line" or "[1:23.5] line"
  el.innerHTML = L ? L.trim().split(/\n\s*\n/).map(v => '<p>' + v.split('\n').map(ln => {
    const m = ln.match(/^\s*\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    return m ? '<span data-t="' + (+m[1] * 60 + +m[2]) + '">' + esc(m[3]) + '</span>' : '<span' + (/^\s*Bağlantı\.\.\./.test(ln) ? ' class="bag"' : '') + '>' + esc(ln) + '</span>';
  }).join('') + '</p>').join('') : '';
  fitLyrics();
  const v = $('screen').querySelector('video'), S = [...el.querySelectorAll('span[data-t]')];
  if (!L || !v || !S.length) return;
  el.classList.add('sync');
  const tick = () => { let k = -1; S.forEach((x, i) => { if (v.currentTime >= +x.dataset.t) k = i; }); S.forEach((x, i) => x.classList.toggle('on', i === k)); };
  v.addEventListener('timeupdate', tick); v.addEventListener('seeked', tick); tick();
}
// all lines visible, no scrollbar: shrink the type until the text fits the box
function fitLyrics(){
  const el = $('lyr'); if (el.hidden) return;
  const fit = (min) => { let f = 10.5; el.style.fontSize = f + 'pt';
    const over = () => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;   // columns overflow sideways
    while (over() && f > min) { f -= .25; el.style.fontSize = f + 'pt'; }
    return !over(); };
  el.classList.remove('two');
  if (!fit(7.5)) { el.classList.add('two'); fit(6); }   // long lyrics: two columns before the type gets too small
  // V62 - centre the block by its widest stanza; its lines stay left-aligned
  el.style.marginLeft = '';
  if (el.classList.contains('two') || !el.clientWidth) return;
  const P = [...el.querySelectorAll('p')], r = document.createRange();
  P.forEach(p => p.classList.toggle('cr', P.length > 1 && p === P[P.length - 1] && p.children.length === 1));
  let w = 0; el.querySelectorAll('p:not(.cr) span').forEach(x => { r.selectNodeContents(x); w = Math.max(w, r.getBoundingClientRect().width); });
  if (w) el.style.marginLeft = Math.max(0, (el.clientWidth - w) / 2 - 6) + 'px';
}
addEventListener('resize', () => fitLyrics());
function playQuote(){
  cur = null; lyrics('');
  show(frame(D.quote.id)); speed();
  $('meta').innerHTML = '<h2>' + esc(D.quote.t) + '</h2>';
  renderList(); navState();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function pos(){ const r = ready(); return cur && cur.g === g ? r.findIndex(x => x.li === cur.li && x.ii === cur.ii) : -1; }
function navState(){ const r = ready(), i = pos(); $('prev').disabled = i <= 0; $('next').disabled = i < 0 ? !r.length : i >= r.length - 1; }
$('prev').onclick = () => { const i = pos(); if (i > 0) play(ready()[i - 1]); };
$('next').onclick = () => { const r = ready(), i = pos(); if (i < r.length - 1) play(r[i + 1]); else if (i < 0 && r.length) play(r[0]); };

const gaps = () => { const st = document.querySelector('.stage'), sc = $('screen'); if (!st || !desk()) return;
  const a = st.getBoundingClientRect(), b = sc.getBoundingClientRect();
  st.style.setProperty('--sw', b.width + 'px'); st.style.setProperty('--gw', (b.left - a.left) + 'px'); st.style.setProperty('--lw', Math.max(0, Math.min(150, b.left - a.left - 24)) + 'px'); st.style.setProperty('--gl', (b.left - a.left) / 2 + 'px'); st.style.setProperty('--gr', (b.right - a.left + a.right - a.left) / 2 + 'px'); };
addEventListener('resize', gaps); addEventListener('load', gaps);
// V18d - refit the lyrics once the real column width is known; a column too thin to read hides frame + lyrics
const gapsFit = () => { const st = document.querySelector('.stage'); if (st && desk()) st.classList.toggle('narrow', parseFloat(st.style.getPropertyValue('--gw')) < 170); fitLyrics(); };
addEventListener('resize', gapsFit); addEventListener('load', gapsFit);
const desk = () => matchMedia('(min-width:981px)').matches;
// V64 - Kitap 3 runs to 25: a line after 14 marks 15-25 as extra pieces, empty numbers wait for them
const EK = { K03: [15, 25] };
function ek(L, q){
  const r = EK[L.name]; if (!r || q) return '';
  const has = new Set(L.items.map(x => +split(x.t)[0]));
  let h = '<li class="ek"><span>Ek parçalar</span></li>';
  for (let n = r[0]; n <= r[1]; n++) if (!has.has(n)) h += '<li><div class="row x"><span class="n">' + String(n).padStart(2, '0') + '</span><span></span><span class="s"></span></div></li>';
  return h;
}
function renderList(){
  const G = D.groups[g];
  $('gsw').innerHTML = D.groups.map((x, i) => '<button class="' + (i === g ? 'on' : '') + '" data-g="' + i + '">' + x.name + '</button>').join('');
  $('seg').innerHTML = G.levels.map((L, li) => '<button class="' + (open.has(li) ? 'on' : '') + '" data-l="' + li + '">' + book(L.name) + '<em>' + L.items.filter(x => x.id).length + ' / ' + L.items.length + '</em></button>').join('');
  $('mods').classList.toggle('q', !!q);
  $('grp').innerHTML = D.groups.map((x, i) => '<button class="' + (i === g ? 'on' : '') + '" data-g="' + i + '">' + x.name + '</button>').join('');
  const all = G.levels.flatMap(L => L.items);
  $('tot').textContent = all.filter(x => x.id).length + ' / ' + all.length + ' video hazır';
  let html = '';
  G.levels.forEach((L, li) => {
    const items = L.items.map((x, ii) => ({ ...x, ii })).filter(x => !q || low(x.t).includes(q));
    if (q && !items.length) return;
    const n = L.items.filter(x => x.id).length, isOpen = q || open.has(li);
    html += '<div class="mod' + (isOpen ? ' open' : '') + '"><button data-l="' + li + '"><span class="k">' + book(L.name) + '</span><span class="ch">▼</span>' +
      '<span class="p"><span>' + n + ' / ' + L.items.length + ' hazır</span><span class="bar"><i style="width:' + (L.items.length ? n / L.items.length * 100 : 0) + '%"></i></span></span>' +
      '</button><ol>' +
      items.map(x => {
        const [num, t] = split(x.t);
        const on = cur && cur.g === g && cur.li === li && cur.ii === x.ii;
        // V24b - every row opens; no-video rows keep the crossed camera and show notes/lyrics
        return '<li><button class="row' + (x.id ? '' : ' off') + (on ? ' on' : '') + '" data-li="' + li + '" data-ii="' + x.ii + '"><span class="n">' + num + '</span><span>' + esc(t) + '</span>' +
          (x.id ? '<span class="s">▶</span>' : '<span class="s" title="Video yok"><svg viewBox="0 0 24 24" aria-label="Video yok"><path d="M16 16v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m4 0h3a2 2 0 0 1 2 2v3.3l5-3.3v10"/><path d="M2 2l20 20"/></svg></span>') + '</button></li>';
      }).join('') + ek(L, q) + '</ol></div>';
  });
  $('mods').innerHTML = html || '<div class="empty">Sonuç yok</div>';
}

$('grp').onclick = $('gsw').onclick = e => { const b = e.target.closest('button'); if (!b) return; g = +b.dataset.g; open.clear(); open.add(0); renderList(); if (!cur || cur.g !== g) idle(); else navState(); };
$('mods').onclick = e => {
  const r = e.target.closest('button.row');
  if (r) { const li = +r.dataset.li, ii = +r.dataset.ii; play({ ...D.groups[g].levels[li].items[ii], li, ii }); return; }
  const h = e.target.closest('.mod > button');
  if (h) { const li = +h.dataset.l; if (desk()) { open.clear(); open.add(li); } else open.has(li) ? open.delete(li) : open.add(li); renderList(); }
};
$('seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; open.clear(); open.add(+b.dataset.l); renderList(); };
$('q').oninput = e => { q = low(e.target.value.trim()); renderList(); };

const Q = D.quote;
const qm = Q ? Q.t.replace(/ /g, ' ').match(/^(.*?)\s*((?:K\d+\s*)*)$/) : null;
const qh = qm ? '<span class="qt">' + esc(qm[1].trim()) + '</span>' : '';
// V85 - K01-K03 sit in the right footer card; a click still plays the quote video
// V93 - K01 -> "Kitap 1" with the PDF icon
const pdfIco = '<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M3 1h12l6 6v19a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" fill="#fff" stroke="#e23b3b" stroke-width="1.6"/><path d="M15 1v6h6" fill="#fde2e2" stroke="#e23b3b" stroke-width="1.6" stroke-linejoin="round"/><rect x="0" y="13" width="19" height="9" rx="2" fill="#e23b3b"/><text x="9.5" y="20.2" font-size="6.6" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">PDF</text></svg>';
if (qm && qm[2].trim()) $('qk').innerHTML = qm[2].trim().split(/\s+/).map(k => '<em class="pdfk">' + pdfIco + esc(k.replace(/^K0*(\d+)$/, 'Kitap $1')) + '</em>').join('');
// V113 - the quote is plain text, a click does nothing (it used to open the book PDF in the video)
if (Q) $('quote').innerHTML = '<div class="q" style="cursor:default">' + qh + '</div>';
// V104 - Kitap N = the pages of level K0N in list order (the current Uzun/Kısa Sap group), each page once
const bookPages = nm => { const L = D.groups[g].levels.find(l => l.name === 'K' + String(nm.replace(/\D/g, '')).padStart(2, '0')), seen = new Set();
  return L ? L.items.map(x => { const n = split(x.t)[1], S = N[L.name + ' ' + n] || N[n]; return S && S.page && !seen.has(S.page) && seen.add(S.page) ? [{ c: S.page, sb: S.pageBW }].concat(S.page2 ? [{ c: S.page2, sb: S.pageBW2 }] : []) : []; }).flat() : []; };  // V109 - page2
// V103 - Kitap 1/2/3 open the book in the kitap sayfası window, not in the video
// V112 - a book with no piece pages yet shows the scanned book (34 pages) in the same view, not the Drive frame
const scanPages = Array.from({ length: 34 }, (_, i) => { const s = 'notes/kitap-tarama/sayfa-' + String(i + 1).padStart(2, '0') + '.jpg'; return { c: s, sb: s }; });
if (Q && Q.id) { $('qk').onclick = e => { const k = e.target.closest('.pdfk'); if (k) { const p = bookPages(k.lastChild.textContent); openBook(p.length ? p : scanPages, k.lastChild.textContent, Q.id); } }; $('qk').title = 'Kitabı aç'; $('qk').style.cursor = 'pointer'; }
renderList();
idle();
// V17 - desktop: Uzun/Kısa Sap + search sit in the header's left card, the list gets their row
const tb = document.createElement('div'); tb.className = 'tb';
const deskMQ = matchMedia('(min-width:981px)');
const placeBar = () => {
  if (deskMQ.matches) { document.querySelector('.top .wrap').prepend(tb); tb.append($('gsw'), $('q')); }
  else { tb.remove(); $('meta').before($('gsw')); document.querySelector('.cur .head .t').after($('q')); }
  gaps(); gapsFit();
};
deskMQ.addEventListener('change', placeBar); placeBar();
document.documentElement.classList.remove('ld'); // V68
// V96 - live update: a new deploy writes version.json; the page reloads by itself and comes back to the same piece,
// video time and scroll. It never cuts a playing video: it waits until the video is paused or over.
(() => { const K = 'bgLive';
  try { const s = JSON.parse(sessionStorage.getItem(K) || 'null'); sessionStorage.removeItem(K);
    if (s && Date.now() - s.at < 120000) {
      if (D.groups[s.g]) { g = s.g; renderList(); }
      const L = s.li != null && D.groups[g].levels[s.li], x = L && L.items[s.ii];
      if (x) { play({ ...x, li: s.li, ii: s.ii });
        const seek = (n) => { const v = $('screen').querySelector('video'); if (!v) return n > 0 && setTimeout(() => seek(n - 1), 250);
          const go = () => { try { v.currentTime = s.t || 0; } catch (e) {} }; v.readyState >= 1 ? go() : v.addEventListener('loadedmetadata', go, { once: true }); };
        if (s.t) seek(20); }
      setTimeout(() => window.scrollTo(0, s.y || 0), 300); } } catch (e) {}
  let ver = null, due = false;
  const busy = () => { const v = $('screen').querySelector('video'); return v && !v.paused && !v.ended; };
  const go = () => { if (!due || busy()) return;
    const v = $('screen').querySelector('video');
    try { sessionStorage.setItem(K, JSON.stringify({ at: Date.now(), g, li: cur ? cur.li : null, ii: cur ? cur.ii : null, t: v ? v.currentTime : 0, y: window.scrollY })); } catch (e) {}
    location.reload(); };
  const check = () => fetch('version.json?nc=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.v) return; if (ver === null) ver = j.v; else if (j.v !== ver) { due = true; go(); } }).catch(() => {});
  check(); setInterval(check, 20000);
  document.addEventListener('pause', () => setTimeout(go, 500), true); document.addEventListener('ended', go, true);
})();
</script>
